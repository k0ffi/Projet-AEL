<div class="app-wrapper">

    <app-entete [showLogout]="isLoggedIn()">Agence en ligne</app-entete>
  </header>

  <div class="app-layout">
    @if (isLoggedIn()) {
      <aside class="app-sidebar">
        <app-menu></app-menu>
      </aside>
    }

    <main class="app-main">
      <app-contenu></app-contenu>
    </main>
  </div>

  <footer class="app-footer">
    <app-entete></app-entete>
  </footer>
</div>
